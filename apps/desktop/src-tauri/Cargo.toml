[package]
name = "routizen-desktop"
version = "0.1.0"
description = "Routizen desktop (macOS) app"
edition = "2021"
rust-version = "1.77.2"

# main.rs 와 mobile entry point 가 공유하는 라이브러리 크레이트
[lib]
name = "routizen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
